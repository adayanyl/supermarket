<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispensa</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f6f8; color: #1f2937;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    .logo { width: 88px; height: 88px; border-radius: 20px; background: #0f766e; margin: 0 auto 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #4b5563; }
    button { background: #0f766e; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px; font-size: 16px; }
  </style>
</head>
<body>
  <div>
    <div class="logo"></div>
    <h1>Sem conexão</h1>
    <p>A Dispensa precisa de internet para carregar seus dados.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
